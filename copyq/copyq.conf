tool_button_css="\n    ;color: ${fg}\n    ;background: transparent\n    ;border: 0\n    ;border-radius: 6px\n    ;padding: 4px 8px"
tool_button_pressed_css="\n    ;background: ${sel_bg}\n    ;border-radius: 6px"
tool_button_selected_css="\n    ;background: #333\n    ;color: ${fg}\n    ;border: 1px solid #3a3a3a\n    ;border-radius: 6px"
use_system_icons=true
