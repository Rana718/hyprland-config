search_bar="\n    ;background: #1e1e1e\n    ;color: ${edit_fg}\n    ;border: 1px solid #3a3a3a\n    ;border-radius: 6px\n    ;margin: 6px\n    ;padding: 3px 8px"
search_bar_focused="\n    ;border: 1px solid ${sel_bg}\n    ;outline: none"
sel_bg=#3584e4
sel_fg=#ffffff
sel_item_css="\n    ;border-radius: 4px\n    ;border: 1px solid #3584e4"
show_number=true
show_scrollbars=false
style_main_window=true
tab_bar_css="\n    ;background: #1a1a1a\n    ;border-bottom: 1px solid #2e2e2e"
tab_bar_item_counter="\n    ;color: #555\n    ;font-size: 6pt"
tab_bar_scroll_buttons_css="\n    ;background: #1a1a1a\n    ;color: #888\n    ;border: 0"
tab_bar_sel_item_counter="\n    ;color: ${sel_bg}"
tab_bar_tab_selected_css="\n    ;padding: 6px 12px\n    ;background: #242424\n    ;border-top: 2px solid ${sel_bg}\n    ;border-left: 0\n    ;border-right: 0\n    ;border-bottom: 0\n    ;color: #e0e0e0"
tab_bar_tab_unselected_css="\n    ;border: 0\n    ;padding: 6px 12px\n    ;background: #1a1a1a\n    ;color: #555"
