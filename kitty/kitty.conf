# ─────────────────────────────────────────────
# Kitty Terminal Configuration
# ─────────────────────────────────────────────

# ── Transparency ──────────────────────────────
background_opacity 0.85
dynamic_background_opacity yes

# Works with KWin, Hyprland, Sway, etc.
background_blur 20

# ── Cursor ────────────────────────────────────
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0.5
cursor_stop_blinking_after 0

# Cursor move animation (smooth trail)
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Font ──────────────────────────────────────
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

# ── Window ────────────────────────────────────
window_padding_width 4
single_window_padding_width 4
window_margin_width 0
remember_window_size yes
confirm_os_window_close 0
hide_window_decorations yes

# ── Tab bar ───────────────────────────────────
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2
tab_activity_symbol none

# ── Colors (dark, matching your alacritty) ────
foreground #c0caf5
background #1e1e24
selection_foreground #1e1e24
selection_background #c0caf5

# TokyoNight palette
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# ── Performance ───────────────────────────────
repaint_delay 6
input_delay 1
sync_to_monitor yes
wayland_enable_ime no
text_composition_strategy legacy

# ── Scrollback ────────────────────────────────
scrollback_lines 10000
wheel_scroll_multiplier 5.0
touch_scroll_multiplier 3.0
progress_bar hidden

# ── Bell ──────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.0

# ── Keybindings ───────────────────────────────
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+tab next_tab
map ctrl+shift+enter new_window
