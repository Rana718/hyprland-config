# ══════════════════════════════════════════════════════════════════════════════
#                    HYPRLAND CONFIGURATION — OPTIMIZED
# ══════════════════════════════════════════════════════════════════════════════

# ─── Monitor ─────────────────────────────────────────────────────────────────
monitor = eDP-1, 1920x1080@144, auto, 1.25

# ─── NVIDIA GPU Rendering ────────────────────────────────────────────────────
env = LIBVA_DRIVER_NAME, nvidia
env = __GLX_VENDOR_LIBRARY_NAME, nvidia
env = NVD_BACKEND, egl
env = __NV_PRIME_RENDER_OFFLOAD, 1
env = __VK_LAYER_NV_optimus, NVIDIA_only
env = WLR_DRM_DEVICES, /dev/dri/card2:/dev/dri/card1
env = GBM_BACKEND, nvidia-drm
env = WLR_NO_HARDWARE_CURSORS, 1
env = ELECTRON_OZONE_PLATFORM_HINT, auto

# ─── Wayland / Toolkit ───────────────────────────────────────────────────────
env = XDG_SESSION_TYPE, wayland
env = XDG_CURRENT_DESKTOP, Hyprland
env = XDG_SESSION_DESKTOP, Hyprland
env = QT_QPA_PLATFORM, wayland
env = QT_QPA_PLATFORMTHEME, qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION, 1
env = QT_AUTO_SCREEN_SCALE_FACTOR, 1
env = GDK_BACKEND, wayland,x11,*
env = SDL_VIDEODRIVER, wayland
env = CLUTTER_BACKEND, wayland
env = MOZ_ENABLE_WAYLAND, 1

# ─── Cursor ──────────────────────────────────────────────────────────────────
env = XCURSOR_SIZE, 24
env = XCURSOR_THEME, Adwaita
env = GTK_THEME, Adwaita:dark
env = ADW_DISABLE_PORTAL, 1

# ─── Programs ────────────────────────────────────────────────────────────────
$terminal = alacritty
$fileManager = thunar
$browser = brave
$menu = rofi -show drun -show-icons

# ─── Autostart ───────────────────────────────────────────────────────────────
exec-once = waybar
exec-once = swaync
exec-once = swayosd-server
exec-once = hyprpaper
exec-once = sleep 5 && hypridle
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = copyq --start-server
exec-once = udiskie
exec-once = blueman-applet

# ─── Input ───────────────────────────────────────────────────────────────────
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
}

# ─── General ─────────────────────────────────────────────────────────────────
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
    allow_tearing = false
}

# ─── Decoration ──────────────────────────────────────────────────────────────
decoration {
    rounding = 10

    blur {
        enabled = true
        size = 4
        passes = 2
        new_optimizations = true
        xray = false
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# ─── Animations ──────────────────────────────────────────────────────────────
animations {
    enabled = true

    bezier = ease, 0.25, 0.1, 0.25, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smooth, 0.5, 0, 0.99, 0.99

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 4, ease, slide
    animation = fade, 1, 3, ease
    animation = workspaces, 1, 3, smooth, slide
    animation = specialWorkspace, 1, 3, ease, slidevert
}

# ─── Layout ──────────────────────────────────────────────────────────────────
dwindle {
    preserve_split = true
    smart_split = true
}

# ─── Misc ────────────────────────────────────────────────────────────────────
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    vrr = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
}

# ─── Cursor (NVIDIA fix) ────────────────────────────────────────────────────
cursor {
    no_hardware_cursors = true
    no_break_fs_vrr = true
}

# ─── Keybindings ─────────────────────────────────────────────────────────────
$mod = SUPER

# Apps
bind = $mod, Return, exec, $terminal
bind = $mod, T, exec, $terminal
bind = $mod, M, exec, $menu
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $fileManager
bind = $mod, V, exec, copyq toggle
bind = $mod, L, exec, hyprlock
bind = $mod, escape, exec, killall wlogout || wlogout
bind = $mod, I, exec, networkmanager_dmenu

# Windows
bind = $mod, Q, killactive,
bind = $mod, F, fullscreen, 1
bind = $mod, D, togglefloating,
bind = $mod, W, exec, killall -SIGUSR1 waybar

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# App switcher (ALT + TAB - all workspaces)
bind = ALT, Tab, exec, rofi -show window -show-icons -icon-theme Papirus -theme ~/.config/rofi/window.rasi

# Resize with SUPER + CTRL + arrows
bind = $mod CTRL, left, resizeactive, -30 0
bind = $mod CTRL, right, resizeactive, 30 0
bind = $mod CTRL, up, resizeactive, 0 -30
bind = $mod CTRL, down, resizeactive, 0 30

# Move window with SUPER + SHIFT + arrows
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move window to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Special workspace
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

# Cycle workspaces
bind = $mod, tab, workspace, e+1
bind = $mod SHIFT, tab, workspace, e-1

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Screenshots (saved to ~/Pictures/Screenshots)
# Screenshots
bind = , Print, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = $mod, Print, exec, grim - | swappy -f -
bind = $mod SHIFT, Print, exec, hyprshot -m window --raw | swappy -f -

# Screen Recording (saved to ~/Videos/Screencasts)
bind = $mod, F9, exec, killall -q wf-recorder && notify-send "Recording stopped" || (wf-recorder -g "$(slurp)" -f ~/Videos/Screencasts/recording_$(date +%Y%m%d_%H%M%S).mp4 & notify-send "Recording started")
bind = $mod, F10, exec, killall -q wf-recorder && notify-send "Recording stopped" || (wf-recorder -f ~/Videos/Screencasts/recording_$(date +%Y%m%d_%H%M%S).mp4 & notify-send "Recording started")

# Volume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Mic mute toggle
bind = CTRL, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Brightness
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Media
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# ─── Window Rules ────────────────────────────────────────────────────────────
windowrule = float on, match:class ^(com.github.hluk.copyq)$
windowrule = float on, match:class ^(copyq)$
windowrule = float on, match:class ^(pavucontrol)$
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:title ^(File Operation Progress)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save File)$
windowrule = immediate on, match:class ^(cs2)$
windowrule = immediate on, match:class ^(steam_app_.*)$
