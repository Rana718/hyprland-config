[mgr]
sort_by = "natural"
sort_dir_first = true
show_hidden = true
show_symlink = true

[opener]
edit = [
   { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
   { run = 'xdg-open "$@"', for = "unix" },
]

[open]
rules = [
   { mime = "text/*", use = "edit" },
   { mime = "application/json", use = "edit" },
   { mime = "application/javascript", use = "edit" },
   { mime = "application/x-shellscript", use = "edit" },
   { mime = "application/toml", use = "edit" },
   { mime = "application/yaml", use = "edit" },
   { mime = "application/xml", use = "edit" },
   { mime = "inode/x-empty", use = "edit" },

   { mime = "image/*", use = "open" },
   { mime = "video/*", use = "open" },
   { mime = "audio/*", use = "open" },
   { mime = "application/pdf", use = "open" },

   { url = "*.lua", use = "edit" },
   { url = "*.conf", use = "edit" },
   { url = "*.md", use = "edit" },
   { url = "*.go", use = "edit" },
   { url = "*.rs", use = "edit" },
   { url = "*.ts", use = "edit" },
   { url = "*.js", use = "edit" },
   { url = "*.py", use = "edit" },
   { url = "*.c", use = "edit" },
   { url = "*.h", use = "edit" },
   { url = "*.html", use = "edit" },
   { url = "*.css", use = "edit" },

   { url = "*", use = "open" },
]
